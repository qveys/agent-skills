name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Repo policy only allows local/same-owner actions, all SHA-pinned.
      # No third-party action satisfies that for checkout/setup-node,
      # so this job uses the git/node CLI already on the runner image instead.
      # These runners keep their workspace between runs (unlike a hosted VM),
      # so this step is written to be safe to re-run: reset any remote/config
      # left by a previous job and wipe untracked/ignored leftovers.
      #
      # GH_TOKEN is scoped to this step only. The auth header is set via
      # `git config --local` (passing it through `-c` on the command line
      # makes git fall back to an interactive credential prompt on 401,
      # which fails non-interactively on the runner) and unset again right
      # after the fetch, so it's never left behind in .git/config.
      - name: Checkout code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch --depth 1 origin "$GITHUB_REF"
          git config --local --unset "http.https://github.com/.extraheader"
          git checkout -f FETCH_HEAD
          git clean -ffdx

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Validate Skills Manifest
        run: npm run skills:validate
