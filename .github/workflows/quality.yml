name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: [self-hosted, hostinger]
    steps:
      # Repo policy requires SHA-pinning; actions/checkout and
      # actions/setup-node are explicitly allow-listed (verified via
      # `gh api repos/{owner}/{repo}/actions/permissions/selected-actions`),
      # so no manual git/node reimplementation is needed here.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Validate Skills Manifest
        run: npm run skills:validate
