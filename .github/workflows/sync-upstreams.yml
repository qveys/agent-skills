name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: [self-hosted, hostinger]
    steps:
      # Repo policy requires SHA-pinning; actions/checkout and
      # actions/setup-node are explicitly allow-listed (verified via
      # `gh api repos/{owner}/{repo}/actions/permissions/selected-actions`),
      # so no manual git/node reimplementation is needed here.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Skills Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run skills:sync -- --all

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      # peter-evans/create-pull-request isn't on this repo's Actions allow-list
      # (only actions/checkout and actions/setup-node are), so this uses the
      # gh CLI already on the runner instead.
      #
      # The ruleset on master ("main", id 20919538) enforces
      # `required_signatures`: a plain `git commit` + `git push` from the
      # runner leaves the commit unsigned (signature null) and the sync PR
      # stays BLOCKED (measured on PR #65, head aad0f50, mergeStateStatus
      # BLOCKED). The sync commit is therefore created through the GitHub
      # API (GraphQL `createCommitOnBranch` with the workflow GITHUB_TOKEN):
      # commits created via the API are signed by GitHub ("Verified").
      # `contents: write` above already covers git/refs + createCommitOnBranch.
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="chore/sync-upstream-skills"

          master_sha=$(gh api "repos/$repo/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          git add -A
          new_tree=$(git write-tree)

          # Idempotent like peter-evans/create-pull-request: skip the commit
          # if the sync branch already carries this exact tree, so re-runs
          # with no new upstream changes don't spam the branch.
          branch_sha=""
          branch_tree=""
          if branch_sha=$(gh api "repos/$repo/git/ref/heads/$branch" --jq -e '.object.sha' 2>/dev/null); then
            branch_tree=$(gh api "repos/$repo/git/commits/$branch_sha" --jq '.tree.sha')
          fi
          if [ -n "$branch_sha" ] && [ "$new_tree" = "$branch_tree" ]; then
            echo "No changes since last sync branch commit; skipping commit."
          else
            # fileChanges for createCommitOnBranch, relative to the commit's
            # parent (master): additions carry base64 contents, deletions paths.
            additions='[]'
            deletions='[]'
            while IFS=$'\t' read -r status path _extra; do
              case "$status" in
                D*)
                  deletions=$(jq -cn --arg p "$path" --argjson d "$deletions" '$d + [{path: $p}]')
                  ;;
                *)
                  contents_b64=$(base64 < "$path" | tr -d '\n')
                  additions=$(jq -cn --arg p "$path" --arg c "$contents_b64" --argjson a "$additions" '$a + [{path: $p, contents: $c}]')
                  ;;
              esac
            done < <(git diff --cached --name-status --no-renames "$GITHUB_REF_NAME")

            # Recreate the sync branch from master via the API (equivalent of
            # the old `git checkout -B` + `git push -f`, without ever pushing
            # an unsigned commit): create the ref, or force-update it.
            if [ -n "$branch_sha" ]; then
              gh api -X PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$master_sha" -f force=true >/dev/null
            else
              gh api -X POST "repos/$repo/git/refs" -f "ref=refs/heads/$branch" -f "sha=$master_sha" >/dev/null
            fi

            # One atomic commit on the branch, signed by GitHub.
            jq -n \
              --arg q 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url signature { isValid wasSignedByGitHub } } } }' \
              --arg repo "$repo" \
              --arg branch "$branch" \
              --arg head "$master_sha" \
              --argjson additions "$additions" \
              --argjson deletions "$deletions" \
              '{query: $q, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "🔄 chore(sync): update upstream skills"},
                expectedHeadOid: $head,
                fileChanges: {additions: $additions, deletions: $deletions}
              }}}' > "$RUNNER_TEMP/create-commit.json"
            result=$(gh api graphql --input "$RUNNER_TEMP/create-commit.json")
            commit=$(echo "$result" | jq '.data.createCommitOnBranch.commit')
            echo "$commit"
            if [ "$(echo "$commit" | jq -r '.signature.isValid // empty')" != "true" ]; then
              echo "ERROR: sync commit created via API is not signed; failing the job." >&2
              exit 1
            fi
          fi

          # REST via `gh api`: `gh pr view/edit/create` query the GraphQL
          # projectCards field (Projects classic, removed) and fail.
          num=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$branch" --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            echo "PR #$num already exists for $branch."
          else
            num=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="🔄 chore(sync): update upstream skills" \
              -f body=$'Automated synchronization of upstream Agent Skills.\n\nPlease review the updated `vendor/` directories and `sources.lock.yaml` file.' \
              -f head="$branch" \
              -f base="$GITHUB_REF_NAME" \
              --jq .number)
          fi
          # Label is pre-created in the repo (idempotent POST).
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/labels" -f 'labels[]=automated-sync' >/dev/null
