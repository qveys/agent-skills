name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: [self-hosted, hostinger]
    steps:
      # Repo policy requires SHA-pinning; actions/checkout and
      # actions/setup-node are explicitly allow-listed (verified via
      # `gh api repos/{owner}/{repo}/actions/permissions/selected-actions`),
      # so no manual git/node reimplementation is needed here.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Skills Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run skills:sync -- --all

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      # peter-evans/create-pull-request isn't on this repo's Actions allow-list
      # (only actions/checkout and actions/setup-node are), so this uses the
      # gh CLI already on the runner instead.
      #
      # The ruleset on master ("main", id 20919538) enforces
      # `required_signatures`: a plain `git commit` + `git push` from the
      # runner leaves the commit unsigned (signature null) and the sync PR
      # stays BLOCKED (measured on PR #65, head aad0f50, mergeStateStatus
      # BLOCKED). The sync commit is therefore created through the GitHub
      # API (GraphQL `createCommitOnBranch` with the workflow GITHUB_TOKEN):
      # commits created via the API are signed by GitHub ("Verified").
      # `contents: write` above already covers git/refs + createCommitOnBranch.
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="chore/sync-upstream-skills"
          tmp_branch="chore/sync-upstreams-tmp"
          work="$RUNNER_TEMP/sync-commit"
          mkdir -p "$work"

          master_sha=$(gh api "repos/$repo/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          git add -A
          new_tree=$(git write-tree)

          # Idempotent like peter-evans/create-pull-request: skip the commit
          # if the sync branch already carries this exact tree, so re-runs
          # with no new upstream changes don't spam the branch.
          # NB: `--jq` takes exactly one argument; on a missing ref `gh api`
          # exits non-zero (HTTP 404), which the `if` turns into "branch absent".
          branch_sha=""
          branch_tree=""
          if branch_sha=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null); then
            branch_tree=$(gh api "repos/$repo/git/commits/$branch_sha" --jq '.tree.sha')
          fi
          if [ -n "$branch_sha" ] && [ "$new_tree" = "$branch_tree" ]; then
            echo "No changes since last sync branch commit; skipping commit."
          else
            # Changed paths, NUL-separated (-z) so file names with spaces or
            # non-ASCII characters stay exact; --no-renames turns R into D+A.
            # Each change is appended as one NDJSON line to a chunk FILE:
            # nothing large ever goes through argv (MAX_ARG_STRLEN).
            max_chunk_bytes=1000000 # stay well under the GraphQL payload limit
            chunk_no=0
            chunk_dir="$work/chunk-0"
            mkdir -p "$chunk_dir"
            : > "$chunk_dir/additions.ndjson"
            : > "$chunk_dir/deletions.ndjson"
            while IFS= read -r -d '' status && IFS= read -r -d '' path; do
              case "$status" in
                D*) est=64 ;;
                *)  est=$(( $(wc -c < "$path") * 4 / 3 + ${#path} + 64 )) ;;
              esac
              cur=$(cat "$chunk_dir/additions.ndjson" "$chunk_dir/deletions.ndjson" | wc -c)
              if [ "$cur" -gt 0 ] && [ $((cur + est)) -gt "$max_chunk_bytes" ]; then
                chunk_no=$((chunk_no + 1))
                chunk_dir="$work/chunk-$chunk_no"
                mkdir -p "$chunk_dir"
                : > "$chunk_dir/additions.ndjson"
                : > "$chunk_dir/deletions.ndjson"
              fi
              case "$status" in
                D*)
                  jq -cn --arg p "$path" '{path: $p}' >> "$chunk_dir/deletions.ndjson"
                  ;;
                *)
                  jq -cn --arg p "$path" --rawfile c "$path" '{path: $p, contents: ($c | @base64)}' >> "$chunk_dir/additions.ndjson"
                  ;;
              esac
            done < <(git diff --cached --name-status --no-renames -z "$GITHUB_REF_NAME")

            # Build the signed commits on a TEMPORARY ref first: the sync
            # branch is only moved once every commit is verified signed.
            gh api -X DELETE "repos/$repo/git/refs/heads/$tmp_branch" >/dev/null 2>&1 || true
            gh api -X POST "repos/$repo/git/refs" -f "ref=refs/heads/$tmp_branch" -f "sha=$master_sha" >/dev/null

            # One createCommitOnBranch per chunk (fileChanges read from files
            # via --slurpfile, not argv); expectedHeadOid chains the commits.
            # API-created commits are signed by GitHub ("Verified").
            head="$master_sha"
            for chunk_dir in "$work"/chunk-*; do
              [ -d "$chunk_dir" ] || continue
              [ -s "$chunk_dir/additions.ndjson" ] || [ -s "$chunk_dir/deletions.ndjson" ] || continue
              jq -n \
                --arg q 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid wasSignedByGitHub } } } }' \
                --arg repo "$repo" \
                --arg branch "$tmp_branch" \
                --arg head "$head" \
                --slurpfile additions "$chunk_dir/additions.ndjson" \
                --slurpfile deletions "$chunk_dir/deletions.ndjson" \
                '{query: $q, variables: {input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                  message: {headline: "🔄 chore(sync): update upstream skills"},
                  expectedHeadOid: $head,
                  fileChanges: {additions: $additions, deletions: $deletions}
                }}}' > "$chunk_dir/payload.json"
              result=$(gh api graphql --input "$chunk_dir/payload.json")
              commit_oid=$(echo "$result" | jq -r '.data.createCommitOnBranch.commit.oid')
              sig=$(echo "$result" | jq -r '.data.createCommitOnBranch.commit.signature.isValid')
              echo "chunk $(basename "$chunk_dir"): commit $commit_oid signature.isValid=$sig"
              if [ "$sig" != "true" ]; then
                echo "ERROR: unsigned commit on temp ref; branch $branch left untouched." >&2
                gh api -X DELETE "repos/$repo/git/refs/heads/$tmp_branch" >/dev/null 2>&1 || true
                exit 1
              fi
              head="$commit_oid"
            done

            # All commits signed: move the sync branch to the last signed
            # commit (API equivalent of the old `git push -f`; -F sends a real
            # boolean, -f would send the string "true"), then drop the temp ref.
            if [ -n "$branch_sha" ]; then
              gh api -X PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$head" -F force=true >/dev/null
            else
              gh api -X POST "repos/$repo/git/refs" -f "ref=refs/heads/$branch" -f "sha=$head" >/dev/null
            fi
            gh api -X DELETE "repos/$repo/git/refs/heads/$tmp_branch" >/dev/null 2>&1 || true
          fi

          # REST via `gh api`: `gh pr view/edit/create` query the GraphQL
          # projectCards field (Projects classic, removed) and fail.
          num=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$branch" --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            echo "PR #$num already exists for $branch."
          else
            num=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f title="🔄 chore(sync): update upstream skills" \
              -f body=$'Automated synchronization of upstream Agent Skills.\n\nPlease review the updated `vendor/` directories and `sources.lock.yaml` file.' \
              -f head="$branch" \
              -f base="$GITHUB_REF_NAME" \
              --jq .number)
          fi
          # Label is pre-created in the repo (idempotent POST).
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/labels" -f 'labels[]=automated-sync' >/dev/null
