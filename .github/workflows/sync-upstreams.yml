name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: [self-hosted, hostinger]
    steps:
      # Repo policy requires SHA-pinning; actions/checkout and
      # actions/setup-node are explicitly allow-listed (verified via
      # `gh api repos/{owner}/{repo}/actions/permissions/selected-actions`),
      # so no manual git/node reimplementation is needed here.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Skills Sync
        run: npm run skills:sync -- --all

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      # peter-evans/create-pull-request isn't on this repo's Actions allow-list
      # (only actions/checkout and actions/setup-node are), so this uses the
      # gh CLI already on the runner instead.
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/sync-upstream-skills"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Idempotent like peter-evans/create-pull-request: skip the
          # commit/force-push if the sync branch already carries this exact
          # diff, so re-runs with no new upstream changes don't spam pushes.
          git add -A
          new_tree=$(git write-tree)
          old_tree=$(git fetch origin "$branch:refs/remotes/origin/$branch" 2>/dev/null \
            && git rev-parse "origin/$branch^{tree}" 2>/dev/null || true)

          if [ "$new_tree" = "$old_tree" ]; then
            echo "No changes since last sync branch push; skipping commit/push."
          else
            git checkout -B "$branch"
            git commit -m "🔄 chore(sync): update upstream skills"
            git push -f origin "$branch"
          fi

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --add-label automated-sync
            echo "PR already exists for $branch."
          else
            gh pr create \
              --title "🔄 chore(sync): update upstream skills" \
              --body $'Automated synchronization of upstream Agent Skills.\n\nPlease review the updated `vendor/` directories and `sources.lock.yaml` file.' \
              --base "$GITHUB_REF_NAME" \
              --head "$branch" \
              --label automated-sync
          fi
