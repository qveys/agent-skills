name: Sync Upstream Skills

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Repo policy only allows local/same-owner actions, all SHA-pinned.
      # No third-party action satisfies that for checkout/setup-node/PR creation,
      # so this job uses the git/node/gh CLI already on the runner image instead.
      # These runners keep their workspace between runs (unlike a hosted VM),
      # so this step is written to be safe to re-run: reset any remote/config
      # left by a previous job and wipe untracked/ignored leftovers.
      #
      # GH_TOKEN is scoped to this step (and the PR-creation step below) only,
      # and passed via `git -c` per-command rather than `git config --local`
      # so it's never persisted to .git/config on this shared, persistent runner.
      - name: Checkout code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || \
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch --depth 1 origin "$GITHUB_REF"
          git checkout -f FETCH_HEAD
          git clean -ffdx

      - name: Install dependencies
        run: npm ci

      - name: Run Skills Sync
        run: npm run skills:sync -- --all

      - name: Check for changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/sync-upstream-skills"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(sync): update upstream skills"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push -f origin "$branch"

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR already exists for $branch; branch updated."
          else
            gh pr create \
              --title "🔄 chore(sync): update upstream skills" \
              --body $'Automated synchronization of upstream Agent Skills.\n\nPlease review the updated `vendor/` directories and `sources.lock.yaml` file.' \
              --base "$GITHUB_REF_NAME" \
              --head "$branch" \
              --label automated-sync
          fi
